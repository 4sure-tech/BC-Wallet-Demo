name: Build, Push and Deploy 
on:
  workflow_dispatch:
  push:
    branches:
      - integration/fixes
    paths:
        - "apps/bc-wallet-api-server/**"
        - "apps/bc-wallet-traction-adapter/**"
        - "apps/bc-wallet-showcase-creator/**"
        - "apps/bc-wallet-demo-server/**"
        - "apps/bc-wallet-demo-web/**"
        - "charts/**"
        - ".github/**"

jobs:
  ready:
    name: "Check if PR is ready for review"
    runs-on: ubuntu-latest  
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.ready_for_review.outputs.true_false }}
      build: ${{ steps.ready_for_review.outputs.owner_true_false }}
    steps:
      - id: ready_for_review
        run: |
          echo "true_false=${{ toJSON(github.event.pull_request.draft != true && github.repository_owner == '4sure-tech') }}" >> $GITHUB_OUTPUT #should change to bcgov
          echo "owner_true_false=${{ toJSON(github.repository_owner == '4sure-tech') }}" >> $GITHUB_OUTPUT #bcgov

  build_api_server:
    name: "Build API Server"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ready
    if: ${{ always() && fromJSON(needs.ready.outputs.deploy) == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Build API Server Image
        uses: ./.github/actions/build_docker
        id: builder
        with:
          context: "."
          dockerfile: "./apps/bc-wallet-api-server/Dockerfile"
          image_name: ${{ github.repository_owner}}/bc-wallet-api-server
          registry: ghcr.io
          registry_username: ${{ github.repository_owner}}
          registry_password: ${{ secrets.CR_PAT }}
    outputs:
      image_tag: ${{ steps.builder.outputs.image_tag }}

  build_traction_adapter:
    name: "Build Traction Adapter"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ready
    if: ${{ always() && fromJSON(needs.ready.outputs.deploy) == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Traction Adapter Image
        uses: ./.github/actions/build_docker
        id: builder
        with:
          context: "."
          dockerfile: "./apps/bc-wallet-traction-adapter/Dockerfile"
          image_name: ${{ github.repository_owner}}/bc-wallet-traction-adapter
          registry: ghcr.io
          registry_username: ${{ github.repository_owner}}
          registry_password: ${{ secrets.CR_PAT }}
    outputs:
      image_tag: ${{ steps.builder.outputs.image_tag }}

  build_showcase_creator:
    name: "Build Showcase Creator"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ready
    if: ${{ always() && fromJSON(needs.ready.outputs.deploy) == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Showcase Creator Image
        uses: ./.github/actions/build_docker
        id: builder
        with:
          context: "."
          dockerfile: "./apps/bc-wallet-showcase-creator/Dockerfile"
          image_name: ${{ github.repository_owner}}/bc-wallet-showcase-creator
          registry: ghcr.io
          registry_username: ${{ github.repository_owner}}
          registry_password: ${{ secrets.CR_PAT }}
    outputs:
      image_tag: ${{ steps.builder.outputs.image_tag }}

  build_demo_server:
    name: "Build Demo Server"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ready
    if: ${{ always() && fromJSON(needs.ready.outputs.deploy) == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Demo Server Image
        uses: ./.github/actions/build_docker
        id: builder
        with:
          context: "."
          dockerfile: "./apps/bc-wallet-demo-server/Dockerfile"
          image_name: ${{ github.repository_owner}}/bc-wallet-demo-server
          registry: ghcr.io
          registry_username: ${{ github.repository_owner}}
          registry_password: ${{ secrets.CR_PAT }}
    outputs:
      image_tag: ${{ steps.builder.outputs.image_tag }}

  build_demo_web:
    name: "Build Demo Web"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ready
    if: ${{ always() && fromJSON(needs.ready.outputs.deploy) == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Demo Web Image
        uses: ./.github/actions/build_docker
        id: builder
        with:
          context: "."
          dockerfile: "./apps/bc-wallet-demo-web/Dockerfile"
          image_name: ${{ github.repository_owner}}/bc-wallet-demo-web
          registry: ghcr.io
          registry_username: ${{ github.repository_owner}}
          registry_password: ${{ secrets.CR_PAT }}
    outputs:
      image_tag: ${{ steps.builder.outputs.image_tag }}

  deploy:
    name: "Deploy to K3s"
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build_api_server
      - build_traction_adapter
      - build_showcase_creator
      - build_demo_web
      - build_demo_server
    if: ${{ always() && !(contains(needs.*.result, 'failure')) }}
    steps:
      - uses: actions/checkout@v4
      
      # Copy charts to K3s server
      - name: Copy charts to K3s server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USERNAME }}
          key: ${{ secrets.K3S_SSH_KEY }}
          source: "charts/"
          target: "/home/ubuntu/pipeline"
          overwrite: true
          strip_components: 0

      # Deploy using SSH to K3s instance
      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USERNAME }}
          key: ${{ secrets.K3S_SSH_KEY }}
          command_timeout: "15m"
          script: |
            cd /home/ubuntu/pipeline/charts/bc-wallet
            
            # Update dependencies and deploy with Helm
            helm dependency update
            
            helm upgrade --install bc-wallet-demo --namespace development \
              --set global.extraEnvVarsSecret=bc-wallet-secrets \
              --set apiServer.image.tag=${{ needs.build_api_server.outputs.image_tag }} \
              --set tractionAdapter.image.tag=${{ needs.build_traction_adapter.outputs.image_tag }} \
              --set showcaseCreator.image.tag=${{ needs.build_showcase_creator.outputs.image_tag }} \
              --set demoWeb.image.tag=${{ needs.build_demo_web.outputs.image_tag }} \
              --set demoServer.image.tag=${{ needs.build_demo_server.outputs.image_tag }} \
              --set postgresql.primary.persistence.storageClass=local-path \
              --set rabbitmq.persistence.storageClass=local-path \
              --set ingress.enabled=true \
              --set ingress.className=traefik \
              . --wait
            
            # Clean up
            rm -rf /home/ubuntu/pipeline/charts
      
      # Restart deployments to ensure they pick up any changes
      - name: Restart Deployments
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USERNAME }}
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            sudo kubectl rollout restart deployment bc-wallet-demo-bc-wallet-api-server
            sudo kubectl rollout restart deployment bc-wallet-demo-bc-wallet-traction-adapter
            sudo kubectl rollout restart deployment bc-wallet-demo-bc-wallet-showcase-creator
            sudo kubectl rollout restart deployment bc-wallet-demo-bc-wallet-demo-web
            sudo kubectl rollout restart deployment bc-wallet-demo-bc-wallet-demo-server