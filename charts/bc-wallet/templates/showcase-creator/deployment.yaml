{{- if .Values.showcaseCreator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bc-wallet.fullname" . }}-showcase-creator
  namespace: {{ .Values.global.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/component: showcase-creator
    app.kubernetes.io/part-of: bc-wallet
    {{- include "bc-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.showcaseCreator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: showcase-creator
      {{- include "bc-wallet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.showcaseCreator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: showcase-creator
        {{- include "bc-wallet.labels" . | nindent 8 }}
        {{- with .Values.showcaseCreator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.showcaseCreator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ if .Values.showcaseCreator.serviceAccount.create }}{{ if .Values.showcaseCreator.serviceAccount.name }}{{ .Values.showcaseCreator.serviceAccount.name }}{{ else }}{{ $.Release.Name }}-{{ .Values.showcaseCreator.name }}{{ end }}{{ end }}
      {{- with .Values.showcaseCreator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: showcase-creator
          {{- with .Values.showcaseCreator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.showcaseCreator.image.repository }}:{{ .Values.showcaseCreator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.showcaseCreator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.showcaseCreator.port }}
              protocol: TCP
          env:
            - name: SHOWCASE_DB_HOST
              value: {{ .Release.Name }}-postgresql
            - name: SHOWCASE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.database.secret.name" . }}
                  key: {{ include "bc-wallet.database.userPasswordKey" . }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.authtoken.secret.name" . }}
                  key: token
            - name: NEXT_PUBLIC_WALLET_URL
              value: {{ .Values.showcaseCreator.env.NEXT_PUBLIC_WALLET_URL | quote }}
            - name: NEXT_PUBLIC_SHOWCASE_API_URL
              value: {{ .Values.showcaseCreator.env.NEXT_PUBLIC_SHOWCASE_API_URL | quote }}
            - name: NEXT_AUTH_SECRET
              value: {{ .Values.showcaseCreator.env.NEXT_AUTH_SECRET | quote }}
            - name: OIDC_DEFAULT_TENANT
              value: {{ .Values.showcaseCreator.env.OIDC_DEFAULT_TENANT | quote }}
            - name: OIDC_TRUST_HOST
              value: {{ .Values.showcaseCreator.env.OIDC_TRUST_HOST | quote }}
            - name: OIDC_AUTH_URL
              value: {{ .Values.showcaseCreator.env.OIDC_AUTH_URL | quote }}
          {{- include "bc-wallet.renderEnvFrom" (list "showcaseCreator" .) | nindent 10 }}
          {{- with .Values.showcaseCreator.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.showcaseCreator.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.showcaseCreator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.showcaseCreator.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.showcaseCreator.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.showcaseCreator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.showcaseCreator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.showcaseCreator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 