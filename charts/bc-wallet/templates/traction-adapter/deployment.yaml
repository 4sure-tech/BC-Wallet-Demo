{{- if .Values.tractionAdapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bc-wallet.fullname" . }}-traction-adapter
  namespace: {{ .Values.global.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/component: traction-adapter
    app.kubernetes.io/part-of: bc-wallet
    {{- include "bc-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tractionAdapter.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: traction-adapter
      {{- include "bc-wallet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.tractionAdapter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: traction-adapter
        {{- include "bc-wallet.labels" . | nindent 8 }}
        {{- with .Values.tractionAdapter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.tractionAdapter.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bc-wallet.serviceAccountName" . }}
      {{- with .Values.tractionAdapter.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traction-adapter
          {{- with .Values.tractionAdapter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.tractionAdapter.image.repository }}:{{ .Values.tractionAdapter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tractionAdapter.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.tractionAdapter.service.port }}
              protocol: TCP
          env:
            - name: APP_NAME
              value: bc-wallet-traction-adapter
            - name: LOG_LEVEL
              value: {{ .Values.tractionAdapter.logLevel | quote }}
            - name: PORT
              value: {{ .Values.tractionAdapter.service.port | quote }}
            - name: TRACTION_DEFAULT_API_URL
              value: {{ .Values.tractionAdapter.env.TRACTION_DEFAULT_API_URL | quote }}
            - name: FIXED_SHOWCASE_API_URL
              value: {{ .Values.tractionAdapter.env.FIXED_SHOWCASE_API_URL | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.encryption.secret.name" . }}
                  key: key
            - name: TRACTION_DEFAULT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.traction.secret.name" . }}
                  key: api-key
            - name: TRACTION_DEFAULT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.traction.secret.name" . }}
                  key: tenant-id
            - name: TRACTION_DEFAULT_WALLET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "bc-wallet.traction.secret.name" . }}
                  key: wallet-id
          {{- include "bc-wallet.renderEnvFrom" (list "tractionAdapter" .) | nindent 10 }}
          {{- with .Values.tractionAdapter.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tractionAdapter.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tractionAdapter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tractionAdapter.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.tractionAdapter.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tractionAdapter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tractionAdapter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tractionAdapter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}