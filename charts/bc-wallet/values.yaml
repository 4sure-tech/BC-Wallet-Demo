postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    username: postgres
    database: bcwallet
    # Let the chart generate and manage its own password
    password: ""
    secretKeys:
      password: postgres-password
  primary:
    service:
      ports:
        postgresql: 5432
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "local-path"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    podSecurityContext:
      enabled: false

rabbitmq:
  enabled: true
  auth:
    username: user
    # Let the chart generate and manage its own password
    password: ""
  extraPlugins: "rabbitmq_management"
  service:
    type: ClusterIP
    ports:
      amqp: 5672
      management: 15672
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "local-path"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  containerSecurityContext:
    enabled: false
  readinessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

debug: true  # Enable debug mode to create the debug-helper ConfigMap
