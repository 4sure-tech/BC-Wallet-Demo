postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    username: postgres
    database: bcwallet
    # Let the chart generate and manage its own password
    password: ""
  primary:
    service:
      ports:
        postgresql: 5432
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "local-path"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    podSecurityContext:
      enabled: false

rabbitmq:
  enabled: true
  auth:
    username: user
    # Let the chart generate and manage its own password
    password: ""
  extraPlugins: "rabbitmq_management,rabbitmq_peer_discovery_k8s"
  configuration: |-
    management.load_definitions = /app/load_definitions.json
  extraConfiguration: |-
    load_definitions = /app/load_definitions.json
  service:
    type: ClusterIP
    ports:
      amqp: 5672
      management: 15672
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "local-path"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  containerSecurityContext:
    enabled: false

debug: true  # Enable debug mode to create the debug-helper ConfigMap
